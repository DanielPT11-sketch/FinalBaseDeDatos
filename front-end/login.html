<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AuraPOS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo-container">
            <div class="logo-circle-wrapper login-circle">
                <img src="img/logo.png" alt="Logo AuraPOS" onerror="this.src='https://via.placeholder.com/90?text=LOGO'">
            </div>
            <h1 class="login-brand-title">Aura<span class="logo-highlight">POS</span></h1>
            <p class="login-subtitle">Sistema de Cartera y Gestión</p>
        </div>

        <form id="login-form" onsubmit="realizarLogin(event)">
            <div id="error-alert" class="alert-error" style="display: none;"></div>
            
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@aurapos.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <div class="login-footer-text">
            <p>© 2026 AuraPOS — Todos los derechos reservados.</p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
